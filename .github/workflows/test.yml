# .github/workflows/test.yml
name: Python Test with SQL Server

on:
  push:
    branches:
    - main
    - "release/v**"
    - "maint/**"
  pull_request:
    branches:
    - main
    - "release/v**"
    - "maint/**"

permissions:
  contents: read

jobs:
  test-py39-sqlserver2022:
    name: Run tests with Python 3.9 and SQL Server 2022
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Password123!
        ports:
        - 1434:1433
        options: >-
          --name sqlserver
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -Q 'SELECT 1' -N -C || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
    - name: Check out the repository
      uses: actions/checkout@v6

    - name: Set up Python 3.9
      uses: actions/setup-python@v6
      with:
        python-version: "3.9"

    - name: Install ODBC Driver 17 for SQL Server
      run: |
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install activerecord and testsuite from PyPI
      run: |
        pip install rhosocial-activerecord==1.0.0.dev29
        pip install rhosocial-activerecord-testsuite==1.0.0.dev16

    - name: Create test database
      run: |
        python -c "
        import pyodbc

        connection_string = (
            'DRIVER={ODBC Driver 17 for SQL Server};'
            'SERVER=localhost,1434;'
            'DATABASE=master;'
            'UID=sa;'
            'PWD=Password123!;'
            'TrustServerCertificate=yes;'
            'Encrypt=no;'
        )

        conn = pyodbc.connect(connection_string, autocommit=True)
        cursor = conn.cursor()
        cursor.execute('CREATE DATABASE test_db')
        print('Successfully created test_db')
        cursor.close()
        conn.close()
        "

    - name: Create SQL Server scenario config
      run: |
        cat > sqlserver_scenarios.yaml << EOF
        scenarios:
          sqlserver_2022:
            host: localhost
            port: 1434
            database: test_db
            username: sa
            password: Password123!
            driver: "ODBC Driver 17 for SQL Server"
            encrypt: false
            trust_server_certificate: true
            autocommit: true
        EOF
        echo "SQLSERVER_SCENARIOS_CONFIG_PATH=$(pwd)/sqlserver_scenarios.yaml" >> $GITHUB_ENV

    - name: Run tests
      run: |
        export PYTHONPATH=src:tests
        python -m pytest tests/

