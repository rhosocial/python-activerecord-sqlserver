[pytest]
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; pythonpath is what makes ``-p plugins.expression_xdist`` loadable: pytest
; applies this ini value *before* it imports the -p plugins, and a plugin
; imported by name has to be findable by name. It also means a plain ``pytest``
; invocation works without PYTHONPATH=src:tests, which CI sets anyway.
pythonpath = tests
; plugins.expression_xdist is this repository's own: it makes the expression
; area (feature/backend/expression) parallel by default, which the org test
; rules ask for and a conftest cannot do because xdist reads the worker count
; before any conftest loads. See tests/plugins/expression_xdist.py.
addopts = -v --tb=short -p rhosocial.activerecord.testsuite.conftest -p plugins.expression_xdist
filterwarnings =
    ignore::DeprecationWarning
markers =
    requires_sqlserver: mark test as requiring SQL Server connection
    slow: mark test as slow running